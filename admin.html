<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1714">
<title>ئەدمین — بەڕێوەبردنی سەرتاشەکان</title>
<link rel="icon" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { kurdish: ['Vazirmatn','sans-serif'] },
      colors: { brass:'#C9A356', barberred:'#B33A3A', inkbg:'#1B1714', panel:'#241E1A' }
    }}
  }
</script>
<style>
  * { font-family: 'Vazirmatn', sans-serif; }
  .pole-strip { background: repeating-linear-gradient(-45deg, #F7F3EC 0 10px, #B33A3A 10px 20px, #F7F3EC 20px 30px, #C9A356 30px 40px); }
  .tap { transition: transform .08s ease; } .tap:active { transform: scale(.96); }
  .modal-bg { backdrop-filter: blur(3px); }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body class="min-h-screen bg-[#F7F3EC] dark:bg-inkbg text-[#1B1714] dark:text-[#F7F3EC] transition-colors">

<div id="loginView" class="min-h-screen flex flex-col items-center justify-center px-6">
  <div class="w-14 h-14 rounded-2xl pole-strip shadow-lg mb-4 border border-black/10"></div>
  <h1 class="text-2xl font-extrabold mb-1">پەڕەی ئەدمین</h1>
  <p class="text-sm text-[#6b6259] dark:text-[#8A7F72] mb-8">بەڕێوەبردنی هەژماری سەرتاشەکان</p>
  <div class="w-full max-w-sm">
    <label class="block text-sm font-semibold mb-1.5">وشەی نهێنی ئەدمین</label>
    <input id="loginPassword" type="password" dir="ltr" placeholder="••••••••"
      class="w-full rounded-xl px-4 py-3.5 mb-2 bg-white dark:bg-panel border border-black/10 dark:border-white/10 outline-none focus:border-brass text-base text-right">
    <div id="loginError" class="hidden text-barberred text-sm mb-3"></div>
    <button id="loginBtn" class="tap w-full bg-brass text-inkbg font-extrabold py-4 rounded-xl text-base shadow-lg shadow-brass/20 mt-4">چوونەژوورەوە</button>
  </div>
</div>

<div id="appView" class="hidden max-w-md mx-auto min-h-screen px-5 pb-16" style="padding-top: env(safe-area-inset-top);">
  <header class="flex items-center justify-between py-5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full pole-strip shadow-inner border border-black/10"></div>
      <div class="font-extrabold">بەڕێوەبردنی سەرتاشەکان</div>
    </div>
    <button id="themeToggle" class="tap w-10 h-10 rounded-full bg-white dark:bg-panel shadow flex items-center justify-center text-lg border border-black/5 dark:border-white/10">🌙</button>
  </header>

  <button id="addBarberBtn" class="tap w-full bg-brass text-inkbg font-extrabold py-3.5 rounded-xl mb-5 text-sm">+ زیادکردنی سەرتاشی نوێ</button>

  <div id="barberList" class="flex flex-col gap-3"></div>
  <div id="barberEmpty" class="hidden text-center py-16 text-sm text-[#6b6259] dark:text-[#8A7F72]">هیچ سەرتاشێک زیاد نەکراوە</div>

  <button id="changePwBtn" class="tap w-full border border-black/10 dark:border-white/10 text-sm font-bold py-3 rounded-xl mt-8">گۆڕینی وشەی نهێنی ئەدمین</button>
  <button id="logoutBtn" class="tap w-full border-2 border-barberred text-barberred font-extrabold py-3 rounded-xl mt-3 text-sm">دەرچوون</button>
</div>

<div id="modalRoot" class="hidden fixed inset-0 z-50 modal-bg bg-black/40 flex items-end sm:items-center justify-center">
  <div class="bg-[#F7F3EC] dark:bg-inkbg w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto">
    <div class="w-10 h-1.5 bg-black/20 dark:bg-white/20 rounded-full mx-auto mb-4 sm:hidden"></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toastRoot" class="fixed bottom-6 inset-x-0 flex justify-center z-[60] pointer-events-none"></div>

<script>
const CONFIG = { GAS_URL: 'https://script.google.com/macros/s/AKfycbzl1dMgrQPr5cdpERsXCF1OfP14437-2HrPbaSr-RoiEqvkC4ydK6P6O8FErtesXOyq/exec' };
let adminToken = localStorage.getItem('adminToken');

async function api(action, data) {
  const res = await fetch(CONFIG.GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action,data}) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'هەڵەیەک ڕوویدا');
  return json.result;
}
function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = `pointer-events-auto ${isError?'bg-barberred':'bg-inkbg dark:bg-brass'} ${isError?'text-white':'text-white dark:text-inkbg'} text-sm font-bold px-4 py-2.5 rounded-full shadow-lg mb-2`;
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function applyTheme(t){ document.documentElement.classList.toggle('dark', t==='dark'); document.getElementById('themeToggle').textContent = t==='dark'?'☀️':'🌙'; localStorage.setItem('theme', t); }
applyTheme(localStorage.getItem('theme') || 'dark');
document.getElementById('themeToggle').onclick = () => applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');

function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalRoot').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modalRoot').classList.add('hidden'); }
document.getElementById('modalRoot').addEventListener('click', e=>{ if(e.target.id==='modalRoot') closeModal(); });

document.getElementById('loginBtn').onclick = async () => {
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!password) { errEl.textContent='تکایە وشەی نهێنی بنووسە'; errEl.classList.remove('hidden'); return; }
  try {
    const res = await api('adminLogin', { password });
    adminToken = res.token;
    localStorage.setItem('adminToken', adminToken);
    startApp();
  } catch(e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
};
document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('adminToken'); location.reload(); };

function startApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  loadBarbers();
}
(function boot(){ if (adminToken) startApp(); })();

let barbers = [];
async function loadBarbers(){
  try {
    barbers = await api('adminListBarbers', { token: adminToken });
    render();
  } catch(e) {
    if (String(e.message).includes('دەستپێنەگەیشتن')) { localStorage.removeItem('adminToken'); location.reload(); }
    else toast(e.message, true);
  }
}
function render(){
  const list = document.getElementById('barberList');
  list.innerHTML = '';
  document.getElementById('barberEmpty').classList.toggle('hidden', barbers.length>0);
  barbers.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'rounded-2xl bg-white dark:bg-panel border border-black/10 dark:border-white/10 p-4';
    el.innerHTML = `
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="font-bold">${esc(b.shopName||b.name)}</div>
          <div class="text-xs text-[#6b6259] dark:text-[#8A7F72] mt-0.5" dir="ltr" style="text-align:right">${esc(b.email)}</div>
          <div class="text-xs text-[#6b6259] dark:text-[#8A7F72] mt-0.5">کاتی کار: ${b.workStart||'—'} - ${b.workEnd||'—'}</div>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${b.active? 'bg-green-500/15 text-green-700 dark:text-green-400':'bg-black/10 dark:bg-white/10 text-[#6b6259]'}">${b.active?'چالاک':'ناچالاک'}</span>
      </div>
      <div class="flex gap-2">
        <button class="tap flex-1 bg-brass/15 text-brass font-bold py-2 rounded-lg text-xs editB">✎ دەستکاری</button>
        <button class="tap flex-1 bg-barberred/10 text-barberred font-bold py-2 rounded-lg text-xs linkB">🔗 لینک</button>
        <button class="tap flex-1 bg-black/5 dark:bg-white/5 font-bold py-2 rounded-lg text-xs delB">${b.active?'✕ ناچالاککردن':'↩ چالاککردن'}</button>
      </div>`;
    el.querySelector('.editB').onclick = () => openBarberForm(b);
    el.querySelector('.linkB').onclick = () => showLink(b);
    el.querySelector('.delB').onclick = async () => {
      if (b.active) {
        if (!confirm(`دڵنیایت لە ناچالاککردنی هەژماری ${b.name}؟`)) return;
        await api('adminDeleteBarber', { token: adminToken, barberId: b.barberId });
      } else {
        await api('adminUpdateBarber', { token: adminToken, barberId: b.barberId, name:b.name, shopName:b.shopName, email:b.email, active:true });
      }
      toast('نوێکرایەوە ✓');
      loadBarbers();
    };
    list.appendChild(el);
  });
}

document.getElementById('addBarberBtn').onclick = () => openBarberForm(null);

function openBarberForm(b){
  openModal(`
    <h3 class="text-lg font-extrabold mb-4">${b?'دەستکاریکردنی':'زیادکردنی'} سەرتاش</h3>
    <label class="block text-sm font-semibold mb-1.5">ناوی سەرتاش</label>
    <input id="mName" type="text" value="${b?esc(b.name):''}" class="w-full rounded-xl px-4 py-3 mb-3 bg-white dark:bg-panel border border-black/10 dark:border-white/10">
    <label class="block text-sm font-semibold mb-1.5">ناوی دوکان</label>
    <input id="mShop" type="text" value="${b?esc(b.shopName||''):''}" class="w-full rounded-xl px-4 py-3 mb-3 bg-white dark:bg-panel border border-black/10 dark:border-white/10">
    <label class="block text-sm font-semibold mb-1.5">ئیمەیل</label>
    <input id="mEmail" type="email" dir="ltr" value="${b?esc(b.email):''}" class="w-full rounded-xl px-4 py-3 mb-3 bg-white dark:bg-panel border border-black/10 dark:border-white/10 text-right">
    <label class="block text-sm font-semibold mb-1.5">${b?'وشەی نهێنی نوێ (بەتاڵی بهێڵەرەوە ئەگەر نەتەوێت بیگۆڕیت)':'وشەی نهێنی'}</label>
    <input id="mPass" type="text" dir="ltr" placeholder="${b?'••••••••':'وشەیەکی سادە دابنێ'}" class="w-full rounded-xl px-4 py-3 mb-3 bg-white dark:bg-panel border border-black/10 dark:border-white/10 text-right">
    <div class="flex gap-3 mb-5">
      <div class="flex-1">
        <label class="block text-xs font-semibold mb-1.5">لە کاتژمێر</label>
        <input id="mStart" type="time" dir="ltr" value="${b?b.workStart:'09:00'}" class="w-full rounded-xl px-3 py-2.5 bg-white dark:bg-panel border border-black/10 dark:border-white/10">
      </div>
      <div class="flex-1">
        <label class="block text-xs font-semibold mb-1.5">بۆ کاتژمێر</label>
        <input id="mEnd" type="time" dir="ltr" value="${b?b.workEnd:'21:00'}" class="w-full rounded-xl px-3 py-2.5 bg-white dark:bg-panel border border-black/10 dark:border-white/10">
      </div>
    </div>
    <button id="mSave" class="tap w-full bg-brass text-inkbg font-extrabold py-3.5 rounded-xl">پاشەکەوتکردن</button>
  `);
  document.getElementById('mSave').onclick = async () => {
    const name = document.getElementById('mName').value.trim();
    const shopName = document.getElementById('mShop').value.trim() || name;
    const email = document.getElementById('mEmail').value.trim();
    const password = document.getElementById('mPass').value;
    const workStart = document.getElementById('mStart').value;
    const workEnd = document.getElementById('mEnd').value;
    if (!name || !email || (!b && !password)) return toast('تکایە خانە پێویستەکان پڕبکەرەوە', true);
    try {
      if (b) {
        await api('adminUpdateBarber', { token: adminToken, barberId: b.barberId, name, shopName, email, password, active: b.active, workStart, workEnd });
        toast('نوێکرایەوە ✓');
        closeModal();
        loadBarbers();
      } else {
        const res = await api('adminCreateBarber', { token: adminToken, name, shopName, email, password, workStart, workEnd });
        closeModal();
        loadBarbers();
        showCredentials(res);
      }
    } catch(e) { toast(e.message, true); }
  };
}

function showCredentials(res){
  const link = new URL('./booking.html', location.href).toString() + '?b=' + encodeURIComponent(res.barberId);
  openModal(`
    <h3 class="text-lg font-extrabold mb-1">✓ هەژمار دروستکرا</h3>
    <p class="text-sm text-[#6b6259] dark:text-[#8A7F72] mb-4">ئەم زانیارییانە بدە بە سەرتاشەکە بۆ چوونەژوورەوە</p>
    <div class="rounded-xl bg-white dark:bg-panel border border-black/10 dark:border-white/10 p-4 mb-3 text-sm space-y-2" dir="ltr" style="text-align:right">
      <div><b>ئیمەیل:</b> ${esc(res.email)}</div>
      <div><b>وشەی نهێنی:</b> ${esc(res.password)}</div>
    </div>
    <div class="text-xs font-semibold mb-1.5">لینکی نۆرەگرتنی کڕیاران</div>
    <div class="rounded-xl bg-white dark:bg-panel border border-black/10 dark:border-white/10 p-3 mb-3 text-xs break-all" dir="ltr">${link}</div>
    <img class="mx-auto rounded-xl mb-4 w-40 h-40 bg-white p-2" src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=${encodeURIComponent(link)}">
    <button id="closeC" class="tap w-full bg-brass text-inkbg font-extrabold py-3.5 rounded-xl">تەواو</button>
  `);
  document.getElementById('closeC').onclick = closeModal;
}
function showLink(b){
  const link = new URL('./booking.html', location.href).toString() + '?b=' + encodeURIComponent(b.barberId);
  openModal(`
    <h3 class="text-lg font-extrabold mb-4">لینکی ${esc(b.name)}</h3>
    <div class="rounded-xl bg-white dark:bg-panel border border-black/10 dark:border-white/10 p-3 mb-4 text-xs break-all" dir="ltr">${link}</div>
    <img class="mx-auto rounded-xl mb-4 w-40 h-40 bg-white p-2" src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=${encodeURIComponent(link)}">
    <button id="copyL" class="tap w-full bg-brass text-inkbg font-extrabold py-3.5 rounded-xl">کۆپیکردنی لینک</button>
  `);
  document.getElementById('copyL').onclick = async () => { await navigator.clipboard.writeText(link); toast('کۆپیکرا ✓'); };
}

document.getElementById('changePwBtn').onclick = () => {
  openModal(`
    <h3 class="text-lg font-extrabold mb-4">گۆڕینی وشەی نهێنی ئەدمین</h3>
    <input id="mNewPw" type="text" dir="ltr" placeholder="وشەی نهێنی نوێ" class="w-full rounded-xl px-4 py-3 mb-5 bg-white dark:bg-panel border border-black/10 dark:border-white/10 text-right">
    <button id="mSave" class="tap w-full bg-brass text-inkbg font-extrabold py-3.5 rounded-xl">پاشەکەوتکردن</button>
  `);
  document.getElementById('mSave').onclick = async () => {
    const newPassword = document.getElementById('mNewPw').value;
    if (!newPassword || newPassword.length < 4) return toast('لانیکەم ٤ پیت/ژمارە', true);
    await api('adminChangePassword', { token: adminToken, newPassword });
    toast('وشەی نهێنی گۆڕدرا ✓');
    closeModal();
  };
};
</script>
</body>
</html>
